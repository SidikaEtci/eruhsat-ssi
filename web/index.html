<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turkey E-License Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ea669d 0%, #fff309 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        #userStatus {
            margin-top: 15px;
        }

        .user-info {
            background: #d4edda;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            color: #155724;
        }

        .logout-btn {
            margin-left: 15px;
            padding: 5px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .header-links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-links a {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .header-links a:nth-child(2) {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .header-links a:nth-child(3) {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }

        .header-links a:nth-child(4) {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }

        .header-links a:nth-child(5) {
            background: linear-gradient(135deg, #f6851b 0%, #e2761b 100%);
            box-shadow: 0 4px 15px rgba(246, 133, 27, 0.35);
        }

        .header-links a:hover {
            transform: translateY(-3px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .qr-container {
            text-align: center;
            margin-top: 20px;
        }

        .qr-container img {
            max-width: 300px;
            border: 3px solid #667eea;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .info-box h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .info-box p {
            margin: 5px 0;
            color: #555;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .license-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .license-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        .license-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header-links {
                flex-direction: column;
            }
            
            .header-links a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 data-city-title>Turkey E-License Platform</h1>
            <p data-city-subtitle>Blockchain-Based Digital License Management</p>

            <div class="form-group" style="max-width: 320px; margin: 15px auto;">
                <label for="citySelect" style="color:#333;">Municipality</label>
                <select id="citySelect" style="width:100%;padding:10px;border-radius:8px;border:2px solid #e0e0e0;"></select>
            </div>
            
            <!-- User Status -->
            <div id="userStatus">
                <a href="/login.html" class="btn" style="display: inline-block; padding: 8px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 5px;">
                      Sign In
                </a>
            </div>
            
            <div class="header-links">
                <a href="/ipfs_explorer.html" target="_blank">
                     ️ IPFS Explorer
                </a>
                <a href="/blockchain_explorer.html" target="_blank">
                     ️ Blockchain
                </a>
                <a href="/qr-gallery" target="_blank">
                      QR Codes
                </a>
                <a href="/qr-reader" target="_blank">
                      QR Reader
                </a>
                <a href="/wallet" target="_blank">
                      Digital Wallet
                </a>
            </div>
        </div>

        <div class="main-content">
            <!-- Issue License Card -->
            <div class="card">
                <h2>Issue New License</h2>
                <form id="issueForm">
                    <input type="hidden" name="city_slug" id="issueCitySlug" value="">
                    <div class="form-group">
                        <label>License No *</label>
                        <input type="text" name="license_id" data-license-placeholder placeholder="e.g. 2024-KON-001" required>
                    </div>

                    <div class="form-group">
                        <label>License Type *</label>
                        <select name="license_type" required>
                            <option value="">Select...</option>
                            <option value="Restaurant Operating License">Restaurant Operating License</option>
                            <option value="Cafe Operating License">Cafe Operating License</option>
                            <option value="Food Business License">Food Business License</option>
                            <option value="Business Opening License">Business Opening License</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Business Owner *</label>
                        <input type="text" name="owner_name" placeholder="Full name" required>
                    </div>
                    <div class="form-group">
                        <label>Business Name *</label>
                        <input type="text" name="business_name" placeholder="e.g. Meram Kebab House" required>
                    </div>

                    <div class="form-group">
                        <label>National ID *</label>
                        <input type="text" name="citizen_id" placeholder="11-digit national ID" maxlength="11" required>
                    </div>

                    <div class="form-group">
                        <label>  Citizen MetaMask Address (for Digital Wallet)</label>
                        <input type="text" name="eth_address" placeholder="0x... (optional)" style="font-family: monospace;">
                    </div>

                    <div class="form-group">
                        <label>District *</label>
                        <select name="region" id="regionSelect" required>
                            <option value="">Select municipality first...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Address *</label>
                        <textarea name="address" placeholder="Full address..." rows="3" 
                                  style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; font-family: inherit;" 
                                  required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Issue Date *</label>
                        <input type="date" name="issue_date" required>
                    </div>

                    <div class="form-group">
                        <label>Expiry Date *</label>
                        <input type="date" name="expiry_date" required>
                    </div>

                    <div class="form-group">
                        <label>PDF Document (Optional)</label>
                        <input type="file" name="pdf_file" accept=".pdf">
                    </div>

                    <button type="submit" class="btn">Issue License</button>
                </form>

                <div class="loading" id="issueLoading">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>

                <div class="result" id="issueResult"></div>

                <div class="qr-container" id="qrContainer" style="display:none;">
                    <h3>QR Code</h3>
                    <img id="qrImage" src="" alt="QR Code">
                    <p style="margin-top: 10px; color: #666;">Can be shown to the citizen</p>
                </div>
            </div>

            <!-- Verify License Card -->
            <div class="card">
                <h2>Verify License</h2>
                <form id="verifyForm">
                    <div class="form-group">
                        <label>License No</label>
                        <input type="text" id="verifyLicenseId" name="verify_license_id" data-license-placeholder placeholder="e.g. 2024-KON-001" required>
                    </div>

                    <button type="submit" class="btn">Verify</button>
                </form>

                <div class="loading" id="verifyLoading">
                    <div class="spinner"></div>
                    <p>Verifying...</p>
                </div>

                <div class="result" id="verifyResult"></div>

                <!-- Recent Licenses -->
                <div style="margin-top: 30px;">
                    <h3 style="color: #667eea; margin-bottom: 15px;">Recently Issued Licenses</h3>
                    <div class="license-list" id="licenseList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/web/city-settings.js"></script>
    <script>
        // Municipality + login
        window.addEventListener('DOMContentLoaded', async () => {
            await CitySettings.init();
            document.addEventListener('city-changed', () => loadLicenses());
            const token = localStorage.getItem('auth_token');
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            
            const statusDiv = document.getElementById('userStatus');
            
            if (token && user) {
                statusDiv.innerHTML = `
                    <div class="user-info">
                          <strong>${user.name}</strong> (${user.role === 'admin' ? 'Administrator' : 'Officer'})
                        <button onclick="logout()" class="logout-btn">Sign Out</button>
                    </div>
                `;
            }
        });
        
        async function logout() {
            const token = localStorage.getItem('auth_token');
            
            if (token) {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `token=${token}`
                    });
                } catch (e) {
                    console.error('Logout error:', e);
                }
            }
            
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user');
            
            window.location.reload();
        }

        // Issue License Form
        document.getElementById('issueForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            
            // Use wallet endpoint if ETH address is provided
            const ethAddress = formData.get('eth_address') || '';
            const endpoint = ethAddress.startsWith('0x') && ethAddress.length === 42
                ? '/api/issue-to-wallet'
                : '/api/issue';
            
            // Show loading
            document.getElementById('issueLoading').style.display = 'block';
            document.getElementById('issueResult').style.display = 'none';
            document.getElementById('qrContainer').style.display = 'none';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Hide loading
                document.getElementById('issueLoading').style.display = 'none';
                
                if (response.ok && data.success) {
                    // Show success
                    const resultDiv = document.getElementById('issueResult');
                    resultDiv.className = 'result success';
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <h3>   ${data.message}</h3>
                        <p><strong>License No:</strong> ${formData.get('license_id')}</p>
                        ${data.data?.ipfs_hash || data.license?.ipfs_hash ? `<p><strong>IPFS Hash:</strong> ${(data.data?.ipfs_hash || data.license?.ipfs_hash).substring(0, 20)}...</p>` : ''}
                        ${data.wallet_address ? `<p><strong>  Wallet Offer Sent:</strong> ${data.wallet_address.slice(0,6)}…${data.wallet_address.slice(-4)} — citizen must accept in <a href="/wallet" target="_blank" style="color:#f6851b">Digital Wallet</a></p>` : ''}
                        <div style="background: #d4edda; padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 4px solid #28a745;">
                            <strong>Smart Contract:</strong> All business rules passed ✓
                        </div>
                    `;
                    
                    // Show QR code
                    const qrContainer = document.getElementById('qrContainer');
                    const qrImage = document.getElementById('qrImage');
                    qrImage.src = `/api/qr/${formData.get('license_id')}?t=${Date.now()}`;
                    qrContainer.style.display = 'block';
                    
                    // Reset form
                    form.reset();
                    
                    // Refresh license list
                    loadLicenses();
                } else {
                    // Smart Contract or other error
                    throw new Error(data.detail || data.message || 'Operation failed');
                }
            } catch (error) {
                document.getElementById('issueLoading').style.display = 'none';
                const resultDiv = document.getElementById('issueResult');
                resultDiv.className = 'result error';
                resultDiv.style.display = 'block';
                
                // Parse error message to identify Smart Contract errors
                const errorMsg = error.message;
                let displayHTML = '';
                
                if (errorMsg.includes('Smart Contract:')) {
                    // Smart Contract error - show detailed explanation
                    const contractError = errorMsg.replace('Smart Contract: ', '');
                    
                    displayHTML = `
                        <h3>Smart Contract Error</h3>
                        <div style="background: #fff3cd; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #ffc107;">
                            <p style="font-size: 1.1em; margin-bottom: 10px;">
                                <strong>   ${contractError}</strong>
                            </p>
                        </div>
                    `;
                    
                    // Add specific guidance based on error type
                    if (contractError.includes('already registered')) {
                        displayHTML += `
                            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 4px solid #2196f3;">
                                <p><strong>Solution:</strong></p>
                                <ul style="margin: 10px 0; padding-left: 20px;">
                                    <li>Use a different license number</li>
                                    <li>Example: <code>${CitySettings.getSelectedCity().license_id_example.replace('001', String(Math.floor(Math.random() * 1000)).padStart(3, '0'))}</code></li>
                                </ul>
                            </div>
                        `;
                    } else if (contractError.includes('date')) {
                        displayHTML += `
                            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 4px solid #2196f3;">
                                <p><strong>Solution:</strong></p>
                                <ul style="margin: 10px 0; padding-left: 20px;">
                                    <li>Expiry date must be AFTER the issue date</li>
                                    <li>Date format must be YYYY-MM-DD</li>
                                </ul>
                            </div>
                        `;
                    } else if (contractError.includes('National ID')) {
                        displayHTML += `
                            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 4px solid #2196f3;">
                                <p><strong>Solution:</strong></p>
                                <ul style="margin: 10px 0; padding-left: 20px;">
                                    <li>National ID must be exactly 11 digits</li>
                                    <li>Must contain digits only</li>
                                    <li>Example: 12345678901</li>
                                </ul>
                            </div>
                        `;
                    } else if (contractError.includes('Missing fields')) {
                        displayHTML += `
                            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 4px solid #2196f3;">
                                <p><strong>Solution:</strong></p>
                                <ul style="margin: 10px 0; padding-left: 20px;">
                                    <li>Fill in all required fields</li>
                                    <li>Fields marked with (*) are required</li>
                                </ul>
                            </div>
                        `;
                    } else if (contractError.includes('not authorized')) {
                        displayHTML += `
                            <div style="background: #ffebee; padding: 15px; border-radius: 8px; border-left: 4px solid #f44336;">
                                <p><strong>Authorization Error:</strong></p>
                                <p style="margin: 10px 0;">You are not authorized. Only authorized authorities can issue licenses.</p>
                            </div>
                        `;
                    }
                    
                    displayHTML += `
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px;">
                            <p style="color: #666; font-size: 0.9em;">
                                <strong>What is a Smart Contract?</strong><br>
                                An automated rule engine on the blockchain that prevents invalid or incorrect data from being submitted.
                            </p>
                        </div>
                    `;
                } else {
                    // Generic error
                    displayHTML = `
                        <h3>Error</h3>
                        <p style="margin: 15px 0; font-size: 1.1em;">${errorMsg}</p>
                    `;
                }
                
                resultDiv.innerHTML = displayHTML;
            }
        });

        // Verify License Form
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const licenseId = document.getElementById('verifyLicenseId').value.trim();
            
            if (!licenseId) {
                alert('Please enter a license number');
                return;
            }
            
            // Show loading
            document.getElementById('verifyLoading').style.display = 'block';
            document.getElementById('verifyResult').style.display = 'none';
            
            try {
                const response = await fetch(`/api/verify/${licenseId}`);
                const data = await response.json();
                
                // Hide loading
                document.getElementById('verifyLoading').style.display = 'none';
                
                // Show result
                const resultDiv = document.getElementById('verifyResult');
                resultDiv.style.display = 'block';
                
                if (data.valid) {
                    // Valid license
                    const license = data.license;
                    const expiryDate = new Date(license.valid_until);
                    const now = new Date();
                    const daysRemaining = Math.ceil((expiryDate - now) / (1000 * 60 * 60 * 24));
                    
                    let statusBadge = '';
                    if (daysRemaining < 30) {
                        statusBadge = `<span style="background: #ffc107; color: white; padding: 5px 10px; border-radius: 5px;"> ️ ${daysRemaining} days left</span>`;
                    } else {
                        statusBadge = `<span style="background: #28a745; color: white; padding: 5px 10px; border-radius: 5px;">   valid for ${daysRemaining} days</span>`;
                    }
                    
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <div style="text-align: center; margin-bottom: 20px;">
                            <div style="font-size: 60px; margin-bottom: 10px;">  </div>
                            <h3 style="margin-bottom: 10px;">License Valid</h3>
                            ${statusBadge}
                        </div>
                        
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                            <p style="margin: 8px 0;"><strong>License No:</strong> ${license.license_id}</p>
                            <p style="margin: 8px 0;"><strong>Business Name:</strong> ${license.business_name}</p>
                            <p style="margin: 8px 0;"><strong>Business Type:</strong> ${license.license_type}</p>
                            <p style="margin: 8px 0;"><strong>Business Owner:</strong> ${license.owner_name}</p>
                            <p style="margin: 8px 0;"><strong>District:</strong> ${license.region}</p>
                            <p style="margin: 8px 0;"><strong>Address:</strong> ${license.address}</p>
                            <p style="margin: 8px 0;"><strong>Valid From:</strong> ${formatDate(license.valid_from)}</p>
                            <p style="margin: 8px 0;"><strong>Valid Until:</strong> ${formatDate(license.valid_until)}</p>
                            <p style="margin: 8px 0;"><strong>Issuing Authority:</strong> ${license.authority}</p>
                        </div>
                        
                        <div style="margin-top: 20px; text-align: center;">
                            <a href="/verify-qr/${license.license_id}" target="_blank" 
                               style="background: #667eea; color: white; padding: 12px 20px; border-radius: 5px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">
                                  Detailed View
                            </a>
                        </div>
                        <p style="color: #666; font-size: 0.9em; margin-top: 12px; text-align: center;">
                            Encrypted PDF download is available on the <a href="/ipfs_explorer.html">IPFS Explorer</a> after sign-in (officer/admin only).
                        </p>
                    `;
                } else {
                    // Invalid license
                    let reason = 'License is invalid';
                    let icon = '  ';
                    
                    if (data.reason === 'not_found') {
                        reason = 'This license number is not registered';
                        icon = ' ';
                    } else if (data.reason === 'expired') {
                        reason = 'License has expired';
                        icon = '⏰';
                    } else if (data.reason === 'revoked') {
                        reason = 'License has been revoked';
                        icon = ' ';
                    }
                    
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <div style="text-align: center; margin-bottom: 20px;">
                            <div style="font-size: 60px; margin-bottom: 10px;">${icon}</div>
                            <h3>${reason}</h3>
                        </div>
                        
                        <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                            <p style="margin: 0;">
                                <strong>Warning:</strong> This license cannot be used to operate a business.
                            </p>
                        </div>
                        
                        ${data.license ? `
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px;">
                                <p style="margin: 8px 0;"><strong>License No:</strong> ${data.license.license_id}</p>
                                ${data.license.license_type ? `<p style="margin: 8px 0;"><strong>Type:</strong> ${data.license.license_type}</p>` : ''}
                                ${data.license.valid_until ? `<p style="margin: 8px 0;"><strong>Last Valid Until:</strong> ${formatDate(data.license.valid_until)}</p>` : ''}
                            </div>
                        ` : ''}
                    `;
                }
                
            } catch (error) {
                document.getElementById('verifyLoading').style.display = 'none';
                const resultDiv = document.getElementById('verifyResult');
                resultDiv.className = 'result error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 60px; margin-bottom: 10px;"> ️</div>
                        <h3>Connection Error</h3>
                        <p style="margin: 15px 0; color: #666;">
                            Could not verify the license. Please check your internet connection.
                        </p>
                        <button onclick="document.getElementById('verifyForm').dispatchEvent(new Event('submit'))" 
                                style="background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
                              Try Again
                        </button>
                    </div>
                `;
            }
        });

        // Helper function for date formatting
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // Load recent licenses
        async function loadLicenses() {
            try {
                const response = await fetch(`/api/licenses?${CitySettings.apiQuery()}`);
                const data = await response.json();
                
                const listDiv = document.getElementById('licenseList');
                
                if (data.licenses.length === 0) {
                    listDiv.innerHTML = '<p style="color: #999;">No licenses issued yet</p>';
                    return;
                }
                
                listDiv.innerHTML = data.licenses.slice(-10).reverse().map(lic => `
                    <div class="license-item" onclick="fillVerifyForm('${lic.license_id}')">
                        <strong>${lic.license_id}</strong> - ${lic.license_type}<br>
                        <small>${lic.city_name || ''} ${lic.owner_name} | ${lic.region}</small>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading licenses:', error);
            }
        }

        // Fill verify form and submit
        function fillVerifyForm(licenseId) {
            const input = document.getElementById('verifyLicenseId');
            input.value = licenseId;
            document.getElementById('verifyForm').dispatchEvent(new Event('submit'));
        }

        // Load licenses on page load
        loadLicenses();
    </script>
</body>
</html>
