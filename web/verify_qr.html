<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-License Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .loader {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-icon {
            font-size: 80px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
            min-width: 140px;
        }

        .info-value {
            color: #333;
            flex: 1;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .alert-success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .alert-warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            margin: 10px 5px;
            transition: transform 0.2s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .blockchain-badge {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            font-weight: 600;
        }

        .footer-note {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p>Verifying license...</p>
        </div>

        <div id="content" style="display: none;">
            <!-- Content will be loaded here -->
        </div>
    </div>

    <script>
        // Get license ID from URL
        const pathParts = window.location.pathname.split('/');
        const licenseId = pathParts[pathParts.length - 1];

        // Fetch license data
        async function verifyLicense() {
            try {
                const response = await fetch(`/api/verify/${licenseId}`);
                const data = await response.json();

                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                if (data.valid) {
                    showValid(data);
                } else {
                    showInvalid(data);
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                showError();
            }
        }

        function showValid(data) {
            const license = data.license;
            const daysRemaining = Math.ceil((new Date(license.valid_until) - new Date()) / (1000 * 60 * 60 * 24));
            
            let statusAlert = '';
            if (daysRemaining < 30) {
                statusAlert = `<div class="alert alert-warning">Warning: This license expires in ${daysRemaining} days!</div>`;
            } else {
                statusAlert = `<div class="alert alert-success">License is valid (${daysRemaining} days remaining)</div>`;
            }

            document.getElementById('content').innerHTML = `
                <div class="status-icon">  </div>
                <h1>License Valid</h1>

                ${statusAlert}

                <div class="info-card">
                    <div class="info-row">
                        <div class="info-label">License No:</div>
                        <div class="info-value"><strong>${license.license_id}</strong></div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Business Name:</div>
                        <div class="info-value">${license.business_name}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Business Type:</div>
                        <div class="info-value">${license.license_type}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">District:</div>
                        <div class="info-value">${license.region}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Address:</div>
                        <div class="info-value">${license.address}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Valid From:</div>
                        <div class="info-value">${formatDate(license.valid_from)}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Valid Until:</div>
                        <div class="info-value">${formatDate(license.valid_until)}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Issuing Authority:</div>
                        <div class="info-value">${license.authority}</div>
                    </div>
                </div>

                <div class="blockchain-badge">
                      Verified on Blockchain
                </div>

                <div class="footer-note">
                    <strong>Privacy note:</strong><br>
                    The business owner's national ID and personal details are not shown on this page for privacy protection.
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <a href="/" class="btn">← Home</a>
                    <a href="/qr-reader" class="btn btn-secondary">QR Reader</a>
                </div>
            `;
        }

        function showInvalid(data) {
            let reason = '';
            if (data.reason === 'not_found') {
                reason = 'This license number is not registered.';
            } else if (data.reason === 'expired') {
                reason = 'This license has expired.';
            } else if (data.reason === 'revoked') {
                reason = 'This license has been revoked.';
            } else {
                reason = 'License is invalid.';
            }

            document.getElementById('content').innerHTML = `
                <div class="status-icon">  </div>
                <h1>License Invalid</h1>

                <div class="alert alert-error">
                    <strong>   ${reason}</strong>
                </div>

                <div class="info-card">
                    <div class="info-row">
                        <div class="info-label">License Searched:</div>
                        <div class="info-value">${licenseId}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Checked At:</div>
                        <div class="info-value">${new Date().toLocaleString('en-US')}</div>
                    </div>
                </div>

                <div class="alert alert-warning">
                    <strong>Warning:</strong><br>
                    This license cannot be used to operate a business. Please contact the municipality.
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <a href="/" class="btn">← Home</a>
                </div>
            `;
        }

        function showError() {
            document.getElementById('content').innerHTML = `
                <div class="status-icon"> ️</div>
                <h1>Verification Error</h1>

                <div class="alert alert-error">
                    <strong>Could not verify the license.</strong><br>
                    Check your internet connection or try again later.
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button onclick="location.reload()" class="btn">Try Again</button>
                    <a href="/" class="btn btn-secondary">← Home</a>
                </div>
            `;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // Run verification
        verifyLicense();
    </script>
</body>
</html>
